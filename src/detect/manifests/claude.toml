id = "claude"
version = "2026.09.09.1"
min_engine_version = 3
updated_at = "2026-09-09T00:00:00Z"
aliases = ["claude-code"]

[[rules]]
# A dialog is CURRENT when its hint footer is the LAST logical non-empty line: approval, permission and
# selection dialogs all end with "Esc to cancel" plus a second hint, and Claude keeps its busy spinner title
# while such a dialog waits for the user (upstream issue #3467), so this must outrank that title. The region is
# logical, not physical, because a narrow pane soft-wraps the footer across two or three rows (Gate-3
# ARB-18C-BOTTOM-WINDOW-001); one answered dialog line printed below the footer already ends the match.
id = "current_approval_footer"
state = "blocked"
priority = 990
region = "bottom_logical_non_empty_lines(1)"
visible_blocker = true
contains = ["esc to cancel"]
any = [
  { contains = ["tab to amend"] },
  { contains = ["enter to select"] },
  { contains = ["enter to confirm"] },
  { contains = ["to navigate"] },
  { contains = ["ctrl+e to explain"] },
]

[[rules]]
# The boxed form of the same dialog: Claude draws the footer inside the box, so the last logical line is the
# box's closing border. Admitting that earlier footer row costs nothing only while the border is PROVEN — the
# regex is anchored to the end of the region, so any other trailing line (work printed after the dialog was
# answered, a prompt box, a divider) leaves this rule unmatched. Structure, not a wider window.
id = "current_approval_boxed"
state = "blocked"
priority = 990
region = "bottom_logical_non_empty_lines(2)"
visible_blocker = true
contains = ["esc to cancel"]
regex = ['(?m)^\s*[╰└╚┗][─━═╌╍┄┅┈┉]+[╯┘╝┛]\s*\z']
any = [
  { contains = ["tab to amend"] },
  { contains = ["enter to select"] },
  { contains = ["enter to confirm"] },
  { contains = ["to navigate"] },
  { contains = ["ctrl+e to explain"] },
]

[[rules]]
id = "osc_title_working"
state = "working"
# 970: above the idle prompt box (950), the suffix-selected form (960), the dynamic fallback (960) and stale
# scrollback blockers (<= 850), but BELOW the current-dialog rules (990).
priority = 970
region = "osc_title"
visible_working = true
# Braille frames cover Claude Code <= 2.1.227; half-circle frames (U+25D0..U+25D3) are the >= 2.1.228 busy
# spinner — without them a working Claude reads as idle.
regex = ['^[\x{2800}-\x{28FF}\x{25D0}-\x{25D3}] ']

[[rules]]
id = "transcript_viewer"
state = "unknown"
priority = 1000
region = "bottom_non_empty_lines(3)"
skip_state_update = true
contains = ["showing detailed transcript"]
any = [
  { contains = ["ctrl+o", "to toggle"] },
  { contains = ["ctrl+e", "show all"] },
  { contains = ["ctrl+e", "collapse"] },
  { contains = ["↑↓ scroll"] },
  { contains = ["? for shortcuts"] },
]

[[rules]]
id = "live_blocked_form"
state = "blocked"
# 960: after_last_horizontal_rule is a suffix selector, not proof of freshness — an answered form followed by
# work still matches it — so it stays below the busy title (970); current dialogs win at 990.
priority = 960
region = "after_last_horizontal_rule"
visible_blocker = true
contains = ["enter to select", "esc to cancel"]
any = [
  { contains = ["tab/arrow keys to navigate"] },
  { contains = ["arrow keys to navigate"] },
  { contains = ["arrows to navigate"] },
  { contains = ["↑/↓ to navigate"] },
  { contains = ["↑↓ to navigate"] },
]

[[rules]]
id = "dynamic_workflow_prompt"
state = "blocked"
# 960: this rule reads the whole recent screen, so a historical "Run a dynamic workflow?" in scrollback must stay
# below an active busy title (970); a current dynamic prompt without a spinner still outranks the prompt box (950).
priority = 960
region = "whole_recent"
visible_blocker = true
contains = ["run a dynamic workflow?", "esc to cancel"]

[[rules]]
id = "live_prompt_box"
state = "idle"
priority = 950
region = "prompt_box_body"
visible_idle = true
line_regex = ['^\s*❯']
not = [
  { contains = ["enter to select"] },
  { contains = ["esc to cancel"] },
  { contains = ["tab/arrow keys"] },
  { contains = ["arrow keys to navigate"] },
  { contains = ["↑/↓ to navigate"] },
]

[[rules]]
id = "model_picker_menu"
state = "unknown"
priority = 900
region = "whole_recent"
skip_state_update = true
contains = ["select model", "enter to set as default", "esc to cancel"]
not = [
  { contains = ["do you want to proceed?"] },
  { contains = ["enter to select"] },
]

[[rules]]
id = "bash_permission_prompt"
state = "blocked"
priority = 850
region = "whole_recent"
visible_blocker = true
contains = ["do you want to proceed?"]
any = [
  { contains = ["bash command"] },
  { contains = ["bash("] },
  { contains = ["contains expansion"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
]
all = [
  { any = [{ line_regex = ['(?i)^\s*❯?\s*yes\b'] }, { line_regex = ['(?i)^\s*1\.\s*yes\b'] }, { line_regex = ['(?i)^\s*2\.\s*no\b'] }] },
]

[[rules]]
id = "generic_permission_prompt"
state = "blocked"
priority = 840
region = "after_last_horizontal_rule"
visible_blocker = true
contains = ["do you want to proceed?", "esc to cancel"]
all = [
  { any = [
    { line_regex = ['(?i)^\s*❯?\s*1\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*2\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*2\.\s*no\b'] },
    { line_regex = ['(?i)^\s*3\.\s*no\b'] },
  ] },
]

[[rules]]
id = "legacy_no_prompt_blocker"
state = "blocked"
priority = 300
region = "whole_recent"
any = [
  { contains = ["do you want to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["would you like to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["waiting for permission"] },
  { contains = ["do you want to allow this connection?"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
  { contains = ["do you want to proceed?", "esc to cancel"] },
  { contains = ["review your answers"] },
  { contains = ["skip interview and plan immediately"] },
]
not = [
  { regex = ['(?m)^\s*❯\s*$'] },
]

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 250
region = "osc_title"
visible_idle = true
regex = ['^\x{2733} ']

[[rules]]
id = "osc_progress_idle"
state = "idle"
priority = 250
region = "osc_progress"
regex = ['^4;0']
