name: CI

# Linux x86_64 is the only supported target; there are no other platform tiers and no multi-target build or
# release workflow. Per-push CI runs `check-required`, the authoritative gate: `just check` on Ubuntu
# (lint, TS tests, nextest, and the maintenance unittests), plus the conventional-commit check.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master, main]
    paths-ignore:
      - "website/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    if: github.event_name != 'push' || github.ref_name == 'master' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate commit subjects
        if: github.event_name == 'push'
        run: python3 scripts/conventional_commits.py --range "${{ github.event.before }}..${{ github.event.after }}"

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        run: python3 scripts/conventional_commits.py "${{ github.event.pull_request.title }}"

  check-required:
    name: check-required (ubuntu, just check)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      # `rust-toolchain.toml` is the single source of truth for the toolchain version; rustup honors it on
      # the first cargo call regardless. Reading the channel here only pre-installs that exact toolchain
      # with its components instead of first downloading whatever `stable` happens to be. The value is
      # validated because this workflow also runs on fork pull requests, where the file is
      # contributor-controlled and an unchecked value could smuggle extra lines into $GITHUB_OUTPUT.
      - name: Resolve the pinned Rust toolchain
        id: rust-toolchain
        run: |
          channel="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          case "$channel" in
            "" | *[!0-9.]*)
              echo "rust-toolchain.toml channel is not a pinned version: '$channel'" >&2
              exit 1
              ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      # The SHA below is pinned off the action's `stable` branch; the explicit `toolchain` input overrides
      # that branch's default, so the job installs the pinned channel and not `stable`.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt,clippy

      - name: Install Rust tools
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: just,cargo-nextest

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          key: ubuntu-latest

      # The gitleaks maintenance unittests skip without the binary; install it so every test executes.
      - name: Install gitleaks 8.30.0
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # `just check` = lint + TS tests + nextest + the maintenance unittests; `just ci` alone skips the
      # maintenance unittests, so hosted Ubuntu never ran them before ADR 0012.
      - name: Run the required suite
        run: just check
