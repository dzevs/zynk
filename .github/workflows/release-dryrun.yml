name: Release candidate evidence

# Candidate-evidence workflow (ADR 0012). Builds the release archives, executes each packaged binary on its
# native runner, writes a hash-bound EVIDENCE.json per target, and produces RELEASE_MANIFEST.txt + SHA256SUMS
# over ELIGIBLE targets only — all as workflow ARTIFACTS. It NEVER creates a GitHub Release, tag, or public
# asset, and uses only the default GITHUB_TOKEN. Cutting a release is a separate, explicitly operator-gated step.
#
# Tiers: `linux-x86_64` is REQUIRED (test-linux + build-linux-x86_64 + manifest must succeed; anything else
# means no release candidate). Optional targets run on demand through `optional_targets`: `eligible` = the
# targets with an applicable hosted test job (macos-aarch64, windows-x86_64); `all` adds the build-only targets
# (linux-aarch64, macos-x86_64), which can be at most BUILT_UNVERIFIED because no hosted test job exists for
# them; `none` is the required-only escape when optional runners are unavailable. Job timeouts bound execution,
# not queueing. ELIGIBLE in the manifest is evidence for the G2/operator inclusion decision, not permission to
# publish. Producer jobs record their own run id/attempt in the sidecar; the manifest downloads only by the
# immutable artifact ids its `needs` context names, so a re-run may reuse a successful producer from an earlier
# attempt (recorded as such) but never a stray or retained artifact.
#
# KNOWN GAP (tracked publicly in docs/zynk/fork-patch-ledger.md, row "release build known gaps"): the
# vendored libghostty-vt Zig build eagerly fetches the `uucode` dep over the network (deps.files.ghostty.org)
# on a cold cache, which makes builds (esp. macOS) network-dependent and occasionally flaky. Pre-warming/vendoring
# that Zig cache for determinism is a follow-up.

on:
  workflow_dispatch:
    inputs:
      version:
        description: version string for artifact names (no leading v), must equal Cargo.toml, e.g. 3.1.0
        required: true
        default: "3.1.0"
        type: string
      libghostty_optimize:
        description: libghostty-vt optimize mode
        required: true
        default: ReleaseFast
        type: choice
        options:
          - ReleaseFast
          - ReleaseSafe
          - ReleaseSmall
      optional_targets:
        description: "optional-tier targets: none (required-only escape) | eligible (macos-aarch64, windows-x86_64) | all (+ build-only linux-aarch64, macos-x86_64)"
        required: true
        default: eligible
        type: choice
        options:
          - none
          - eligible
          - all

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}
  LIBGHOSTTY_VT_OPTIMIZE: ${{ inputs.libghostty_optimize }}
  LIBGHOSTTY_VT_SIMD: 'false'

jobs:
  # ---------------------------------------------------------------- required tier: linux-x86_64
  test-linux:
    name: test-linux (required, just check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install Rust tools
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: just,cargo-nextest
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Restore cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          key: candidate-test-linux
      - name: Run the required suite (lint, TS, nextest, maintenance unittests)
        run: just check

  build-linux-x86_64:
    name: build-linux-x86_64 (required)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      # cargo-zigbuild uses `zig cc` as the C compiler + linker (glibc DYNAMIC builds; the bundled sqlite-vec
      # 0.1.9 C source uses BSD u_int*_t typedefs musl lacks, see ledger row "release build known gaps").
      # rustc >= 1.98 links aarch64-unknown-linux-gnu with `-Wl,--fix-cortex-a53-843419`
      # (rust-lang/rust#155453), which `zig cc` refuses; cargo-zigbuild 0.23.4 filters that flag.
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-zigbuild@0.23.4
      - name: Remove Zig caches
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out
      - name: Build (cargo-zigbuild)
        run: cargo zigbuild --release --locked --target x86_64-unknown-linux-gnu
      - name: Package
        run: |
          set -euo pipefail
          install -m 0755 target/x86_64-unknown-linux-gnu/release/zynk zynk
          # C++ runtime guard: the binary must not pull in a C++ runtime (no unresolved C++ symbols).
          if nm -u zynk 2>/dev/null | grep -E '(__cxa|GLIBCXX|CXXABI|_ZSt)'; then
            echo "error: Linux artifact has unresolved C++ runtime symbols" >&2
            exit 1
          fi
          tar -czf "zynk-v${VERSION}-linux-x86_64.tar.gz" zynk
          rm -f zynk
      - name: Execute the packaged binary and measure it
        run: |
          set -euo pipefail
          rm -rf .exec && mkdir .exec && tar -xzf "zynk-v${VERSION}-linux-x86_64.tar.gz" -C .exec
          .exec/zynk --version | tee exec.txt
          { file .exec/zynk; objdump -T .exec/zynk | grep -o 'GLIBC_[0-9.]*' | sort -uV; } | tee native.txt
      - name: Write evidence sidecar
        run: |
          set -euo pipefail
          python3 scripts/release_evidence.py --target linux-x86_64 --version "$VERSION" \
            --archive "zynk-v${VERSION}-linux-x86_64.tar.gz" --exec-status ran --exec-output-file exec.txt \
            --cargo-toml Cargo.toml --native-tool-output-file native.txt \
            --toolchain "rustc=$(rustc -V)" --toolchain "zig=$(zig version)" \
            --toolchain "cargo-zigbuild=$(cargo zigbuild --version)" --out EVIDENCE.json
      - name: Upload
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zynk-v${{ inputs.version }}-linux-x86_64
          path: |
            zynk-v${{ inputs.version }}-linux-x86_64.tar.gz
            EVIDENCE.json
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------- optional tier: macos-aarch64
  test-macos-aarch64:
    name: test-macos-aarch64 (optional)
    if: ${{ inputs.optional_targets != 'none' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install Rust tools
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: just,cargo-nextest
      # upstream 5981ba4: mlugg/setup-zig's prebuilt zig fails to link libSystem on the macos-latest runner;
      # use Homebrew's macOS-patched zig@0.15 there instead.
      - name: Restore Homebrew Zig cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-zig-0.15-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            homebrew-zig-0.15-${{ runner.os }}-
      - name: Install patched Zig
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install zig@0.15
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix zig@0.15)/bin/zig" version
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install macOS build tools
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja
      - name: Restore cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          key: candidate-test-macos
      - name: Run the macOS applicable suite (nextest without the live_handoff binary)
        run: just ci 'not binary(live_handoff)'

  build-macos-aarch64:
    name: build-macos-aarch64 (optional)
    if: ${{ inputs.optional_targets != 'none' }}
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-darwin
      - name: Install patched Zig (macOS)
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install zig@0.15
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix zig@0.15)/bin/zig" version
      - name: Install macOS build tools
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja
      - name: Remove Zig caches
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out
      - name: Build
        run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Package
        run: |
          set -euo pipefail
          install -m 0755 target/aarch64-apple-darwin/release/zynk zynk
          tar -czf "zynk-v${VERSION}-macos-aarch64.tar.gz" zynk
          rm -f zynk
      - name: Execute the packaged binary and measure it
        run: |
          set -euo pipefail
          rm -rf .exec && mkdir .exec && tar -xzf "zynk-v${VERSION}-macos-aarch64.tar.gz" -C .exec
          .exec/zynk --version | tee exec.txt
          { file .exec/zynk; otool -l .exec/zynk | grep -A4 LC_BUILD_VERSION; } | tee native.txt
      - name: Write evidence sidecar
        run: |
          set -euo pipefail
          python3 scripts/release_evidence.py --target macos-aarch64 --version "$VERSION" \
            --archive "zynk-v${VERSION}-macos-aarch64.tar.gz" --exec-status ran --exec-output-file exec.txt \
            --cargo-toml Cargo.toml --native-tool-output-file native.txt \
            --toolchain "rustc=$(rustc -V)" --toolchain "zig=$(zig version)" --out EVIDENCE.json
      - name: Upload
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zynk-v${{ inputs.version }}-macos-aarch64
          path: |
            zynk-v${{ inputs.version }}-macos-aarch64.tar.gz
            EVIDENCE.json
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------- optional tier: windows-x86_64
  test-windows-x86_64:
    name: test-windows-x86_64 (optional)
    if: ${{ inputs.optional_targets != 'none' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - name: Restore cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          key: candidate-test-windows
      # The Windows applicable suite (ADR 0012, named honestly as a subset): fmt, clippy, the windows_* and
      # client-transport unit tests, a build, and the ConPTY smoke.
      - name: Run Windows checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-Checked {
            param([string]$Command, [string[]]$Arguments)
            & $Command @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "command failed with exit code $LASTEXITCODE`: $Command $($Arguments -join ' ')"
            }
          }
          Invoke-Checked cargo @("fmt", "--check")
          Invoke-Checked cargo @("clippy", "--bin", "zynk", "--locked", "--target", "x86_64-pc-windows-msvc", "--", "-D", "warnings")
          Invoke-Checked cargo @("test", "--locked", "--target", "x86_64-pc-windows-msvc", "--bin", "zynk", "windows_")
          Invoke-Checked cargo @("test", "--locked", "--target", "x86_64-pc-windows-msvc", "--bin", "zynk", "server::client_transport::tests")
          Invoke-Checked cargo @("build", "--locked", "--target", "x86_64-pc-windows-msvc")
      - name: Smoke ConPTY pane
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $PWD "target\x86_64-pc-windows-msvc\debug\zynk.exe"
          .\scripts\windows_smoke_conpty_path.ps1 -ExePath $exe -Session "candidate-windows-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

  build-windows-x86_64:
    name: build-windows-x86_64 (optional)
    if: ${{ inputs.optional_targets != 'none' }}
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - name: Remove Zig caches
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force vendor/libghostty-vt/.zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force vendor/libghostty-vt/zig-out -ErrorAction SilentlyContinue
      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item target\x86_64-pc-windows-msvc\release\zynk.exe zynk.exe
          Compress-Archive -Path zynk.exe -DestinationPath "zynk-v$env:VERSION-windows-x86_64.zip" -Force
          Remove-Item zynk.exe
      - name: Execute the packaged binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -Recurse -Force .exec -ErrorAction SilentlyContinue
          Expand-Archive -Path "zynk-v$env:VERSION-windows-x86_64.zip" -DestinationPath .exec
          $out = & .\.exec\zynk.exe --version
          if ($LASTEXITCODE -ne 0) { throw "zynk --version failed with exit code $LASTEXITCODE" }
          $out | Set-Content -Path exec.txt -Encoding utf8
          Get-Content exec.txt
      - name: Write evidence sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rustc = (rustc -V | Out-String).Trim()
          $zig = (zig version | Out-String).Trim()
          python scripts/release_evidence.py --target windows-x86_64 --version "$env:VERSION" `
            --archive "zynk-v$env:VERSION-windows-x86_64.zip" --exec-status ran --exec-output-file exec.txt `
            --cargo-toml Cargo.toml --toolchain "rustc=$rustc" --toolchain "zig=$zig" --out EVIDENCE.json
          if ($LASTEXITCODE -ne 0) { throw "release_evidence.py failed with exit code $LASTEXITCODE" }
      - name: Upload
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zynk-v${{ inputs.version }}-windows-x86_64
          path: |
            zynk-v${{ inputs.version }}-windows-x86_64.zip
            EVIDENCE.json
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------- build-only targets (no hosted test job)
  build-linux-aarch64:
    name: build-linux-aarch64 (optional, build-only)
    if: ${{ inputs.optional_targets == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      # cargo-zigbuild 0.23.4 filters rustc 1.98's `-Wl,--fix-cortex-a53-843419` (rust-lang/rust#155453), so
      # this artifact is linked WITHOUT the Cortex-A53 erratum 843419 workaround — as every earlier zynk
      # aarch64 build was.
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-zigbuild@0.23.4
      - name: Remove Zig caches
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out
      - name: Build (cargo-zigbuild)
        run: cargo zigbuild --release --locked --target aarch64-unknown-linux-gnu
      - name: Package
        run: |
          set -euo pipefail
          install -m 0755 target/aarch64-unknown-linux-gnu/release/zynk zynk
          if nm -u zynk 2>/dev/null | grep -E '(__cxa|GLIBCXX|CXXABI|_ZSt)'; then
            echo "error: Linux artifact has unresolved C++ runtime symbols" >&2
            exit 1
          fi
          tar -czf "zynk-v${VERSION}-linux-aarch64.tar.gz" zynk
          rm -f zynk
      # No native aarch64 runner in this workflow: the binary is not executed (exec: not_run), so the target is at
      # most BUILT_UNVERIFIED in the manifest.
      - name: Measure the packaged binary
        run: |
          set -euo pipefail
          rm -rf .exec && mkdir .exec && tar -xzf "zynk-v${VERSION}-linux-aarch64.tar.gz" -C .exec
          { file .exec/zynk; objdump -T .exec/zynk | grep -o 'GLIBC_[0-9.]*' | sort -uV; } | tee native.txt
      - name: Write evidence sidecar
        run: |
          set -euo pipefail
          python3 scripts/release_evidence.py --target linux-aarch64 --version "$VERSION" \
            --archive "zynk-v${VERSION}-linux-aarch64.tar.gz" --exec-status not_run \
            --cargo-toml Cargo.toml --native-tool-output-file native.txt \
            --toolchain "rustc=$(rustc -V)" --toolchain "zig=$(zig version)" \
            --toolchain "cargo-zigbuild=$(cargo zigbuild --version)" --out EVIDENCE.json
      - name: Upload
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zynk-v${{ inputs.version }}-linux-aarch64
          path: |
            zynk-v${{ inputs.version }}-linux-aarch64.tar.gz
            EVIDENCE.json
          if-no-files-found: error
          retention-days: 7

  build-macos-x86_64:
    name: build-macos-x86_64 (optional, build-only)
    if: ${{ inputs.optional_targets == 'all' }}
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-apple-darwin
      - name: Install patched Zig (macOS)
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install zig@0.15
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix zig@0.15)/bin/zig" version
      - name: Install macOS build tools
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja
      - name: Remove Zig caches
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out
      - name: Build
        run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Package
        run: |
          set -euo pipefail
          install -m 0755 target/x86_64-apple-darwin/release/zynk zynk
          tar -czf "zynk-v${VERSION}-macos-x86_64.tar.gz" zynk
          rm -f zynk
      # Rosetta execution on the Apple-silicon runner is artifact-execution evidence only; there is no Intel-native
      # test job, so the target is at most BUILT_UNVERIFIED. A failed Rosetta run is recorded as not_run.
      - name: Execute the packaged binary under Rosetta and measure it
        run: |
          set -uo pipefail
          rm -rf .exec && mkdir .exec && tar -xzf "zynk-v${VERSION}-macos-x86_64.tar.gz" -C .exec
          if arch -x86_64 .exec/zynk --version | tee exec.txt; then
            echo "EXEC_STATUS=ran" >> "$GITHUB_ENV"
          else
            echo "Rosetta execution failed; recording exec: not_run"
            : > exec.txt
            echo "EXEC_STATUS=not_run" >> "$GITHUB_ENV"
          fi
          { file .exec/zynk; otool -l .exec/zynk | grep -A4 LC_BUILD_VERSION; } | tee native.txt
      - name: Write evidence sidecar
        run: |
          set -euo pipefail
          python3 scripts/release_evidence.py --target macos-x86_64 --version "$VERSION" \
            --archive "zynk-v${VERSION}-macos-x86_64.tar.gz" --exec-status "$EXEC_STATUS" --exec-output-file exec.txt \
            --cargo-toml Cargo.toml --native-tool-output-file native.txt \
            --toolchain "rustc=$(rustc -V)" --toolchain "zig=$(zig version)" --out EVIDENCE.json
      - name: Upload
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zynk-v${{ inputs.version }}-macos-x86_64
          path: |
            zynk-v${{ inputs.version }}-macos-x86_64.tar.gz
            EVIDENCE.json
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------- manifest (required-target gate)
  manifest:
    name: manifest (RELEASE_MANIFEST + SHA256SUMS over ELIGIBLE targets)
    needs:
      - test-linux
      - build-linux-x86_64
      - test-macos-aarch64
      - build-macos-aarch64
      - test-windows-x86_64
      - build-windows-x86_64
      - build-linux-aarch64
      - build-macos-x86_64
    if: ${{ always() && needs.test-linux.result == 'success' && needs.build-linux-x86_64.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      # Downloads happen ONLY by the immutable artifact id each successful producer exported. A failed or
      # skipped producer has no id and nothing is fetched for it; a stray or retained artifact is never read.
      - name: Download linux-x86_64 (required)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.build-linux-x86_64.outputs.artifact-id }}
          path: dist/linux-x86_64
          merge-multiple: true
      - name: Download macos-aarch64
        if: ${{ needs.build-macos-aarch64.result == 'success' && needs.build-macos-aarch64.outputs.artifact-id != '' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.build-macos-aarch64.outputs.artifact-id }}
          path: dist/macos-aarch64
          merge-multiple: true
      - name: Download windows-x86_64
        if: ${{ needs.build-windows-x86_64.result == 'success' && needs.build-windows-x86_64.outputs.artifact-id != '' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.build-windows-x86_64.outputs.artifact-id }}
          path: dist/windows-x86_64
          merge-multiple: true
      - name: Download linux-aarch64
        if: ${{ needs.build-linux-aarch64.result == 'success' && needs.build-linux-aarch64.outputs.artifact-id != '' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.build-linux-aarch64.outputs.artifact-id }}
          path: dist/linux-aarch64
          merge-multiple: true
      - name: Download macos-x86_64
        if: ${{ needs.build-macos-x86_64.result == 'success' && needs.build-macos-x86_64.outputs.artifact-id != '' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.build-macos-x86_64.outputs.artifact-id }}
          path: dist/macos-x86_64
          merge-multiple: true
      - name: Record producer results
        env:
          PRODUCERS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$PRODUCERS" > producers.json
      - name: Build the manifest (fails unless linux-x86_64 is ELIGIBLE)
        env:
          OPTIONAL_TARGETS: ${{ inputs.optional_targets }}
        run: |
          set -euo pipefail
          python3 scripts/release_manifest.py --version "$VERSION" --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --optional-targets "$OPTIONAL_TARGETS" --producers producers.json \
            --dist dist --cargo-toml Cargo.toml --out out
      - name: Upload manifest (also when it FAILED, so the gate can read why)
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-manifest
          path: out/
          if-no-files-found: error
          retention-days: 7
